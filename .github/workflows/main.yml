name: US-Stock-Probe-Test

on:
  workflow_dispatch: # 允許手動點擊執行

permissions:
  contents: write # 賦予寫入權限以便存儲 JSON 結果

jobs:
  test-us-worker:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v3

      - name: 2. 設置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝必要依賴
        run: |
          pip install yfinance requests pandas lxml

      - name: 4. 執行美股衛星收割機
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python crawlers/us_stock_worker.py

      - name: 5. 自動提交採集結果
        run: |
          git config --global user.name "GitHub-Actions-Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git commit -m "Probe: META Data Collection $(date)" || echo "No changes"
          git push
