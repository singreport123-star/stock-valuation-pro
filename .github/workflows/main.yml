name: Financial Data Harvester Pro

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Deps
        run: pip install --no-cache-dir yfinance requests pandas

      - name: Execute Main
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python main.py

      - name: Push Data
        run: |
          git config --global user.name "Financial-Bot"
          git config --global user.email "bot@github.com"
          git add data/
          git commit -m "Full-Scale Update: $(date)" || echo "No changes to commit"
          git push
