name: Financial Data Harvester Union

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: write

jobs:
  run-union-harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Industrial Deps
        run: |
          pip install --no-cache-dir yfinance requests pandas lxml

      - name: Execute Union Harvest
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python main.py

      - name: Sync to Repository
        run: |
          git config --global user.name "Financial-Bot-Architect"
          git config --global user.email "bot@github.com"
          git add data/
          git commit -m "Union Data Update: $(date)" || echo "No changes"
          git push
